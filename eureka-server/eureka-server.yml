# spring:
#   application:
#     name: eureka-server
#   boot:
#     admin:
#       context-path: /admin
server:
  port: 8070
eureka:
  instance:
    #Sets the Eureka instance hostname
    hostname: eurekaserver
  client:
    #Tells the Config Server to not register with the Eureka service...
    registerWithEureka: false
    #...and to not cache registry information locally
    fetchRegistry: false
    serviceUrl:
      defaultZone: http://eurekaserver:${server.port}/eureka/
  server:
    waitTimeInMsWhenSyncEmpty: 5
      
      
management:
  endpoints:
    web:
      exposure:
        include: "*"
